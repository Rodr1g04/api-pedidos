openapi: 3.1.1
info:
  title: API de Pedidos
  description: Documentação oficial da API RESTful de pedidos utilizando Express, Mongoose e autenticação JWT.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: Ambiente de desenvolvimento
tags:
  - name: autenticação
    description: Rotas de login e geração de token JWT
  - name: pedidos
    description: CRUD de pedidos
paths:
  /auth/login:
    post:
      summary: Realiza login e retorna um token JWT
      tags:
        - autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: 12345
      responses:
        200:
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login bem-sucedido
                  token:
                    type: string
        401:
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /pedidos:
    get:
      summary: Lista todos os pedidos
      tags:
        - pedidos
      responses:
        200:
          description: Lista de pedidos retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pedido'
        500:
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

    post:
      summary: Cria um novo pedido
      tags:
        - pedidos
      security:
        - token_jwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoInput'
      responses:
        201:
          description: Pedido criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        400:
          description: Erro de validação dos dados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        403:
          description: Token não fornecido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        401:
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /pedidos/{pedidoId}:
    get:
      summary: Busca um pedido pelo ID
      tags:
        - pedidos
      parameters:
        - in: path
          name: pedidoId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        400:
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        404:
          description: Pedido não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    put:
      summary: Atualiza um pedido existente
      tags:
        - pedidos
      security:
        - token_jwt: []
      parameters:
        - in: path
          name: pedidoId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoInput'
      responses:
        200:
          description: Pedido atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        400:
          description: ID inválido ou dados incorretos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        404:
          description: Pedido não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        403:
          description: Token não fornecido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        401:
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    delete:
      summary: Deleta um pedido pelo ID
      tags:
        - pedidos
      security:
        - token_jwt: []
      parameters:
        - in: path
          name: pedidoId
          required: true
          schema:
            type: string
      responses:
        204:
          description: Pedido deletado com sucesso
          content: {}
        400:
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        404:
          description: Pedido não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        401:
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        403:
          description: Token não fornecido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
components:
  schemas:
    Pedido:
      type: object
      properties:
        _id:
          type: string
          example: "690f0db4a7936c842fcef6bb"
        cliente:
          type: string
        produto:
          type: string
        quantidade:
          type: number
        valorTotal:
          type: number
        status:
          type: string
        dataCriacao:
          type: string
          example: "2025-11-08T09:30:28.098Z"

    PedidoInput:
      type: object
      properties:
        cliente:
          type: string
          example: Rodrigo
        produto:
          type: string
          example: Teclado
        quantidade:
          type: number
          example: 1
        valorTotal:
          type: number
          example: 200
        status:
          type: string
          example: Pendente
    Erro:
      type: object
      properties:
        error:
          type: string
          example: Token inválido ou expirado
        detalhes:
          type: string
          example: Campo cliente é obrigatório
  securitySchemes:
    token_jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT